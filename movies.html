<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>movies</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background: #1E1824;
            color: #fff;
            font-family: "Comic Sans MS", "Comic Sans", "Chalkboard SE", "Comic Neue", sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
            overflow: hidden;
            position: relative;
            isolation: isolate;
        }

        .top-nav {
            position: fixed;
            top: 20px;
            left: 0;
            right: 0;
            z-index: 2;
            display: flex;
            justify-content: center;
            gap: 24px;
        }

        .top-nav a {
            color: #fff;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.2s;
        }

        .top-nav a:hover,
        .top-nav a.active {
            color: #b98bd0;
        }

        .empty-message {
            position: relative;
            z-index: 1;
            font-size: 16px;
            color: #fff;
            text-align: center;
        }
    </style>
</head>
<body>
<nav class="top-nav">
    <a href="index.html">home</a>
    <a href="movies.html" class="active">movies</a>
    <a href="games.html">games</a>
</nav>


<main class="page-content">
    <div id="movie-grid" class="movie-grid"></div>
    <p id="movie-status">loading movies...</p>
</main>

<div id="movie-overlay" class="movie-overlay" hidden>
    <div class="movie-window">
        <div class="movie-header">
            <span id="player-title"></span>
            <button id="close-player" aria-label="Close player">&times;</button>
        </div>

        <div class="movie-screen">
            <iframe
                id="player-frame"
                allowfullscreen
                webkitallowfullscreen
                mozallowfullscreen
                allow="autoplay; fullscreen"
            ></iframe>
        </div>
    </div>
</div>

<style>
    .movie-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, 160px);
        justify-content: center;
        gap: 24px;
        width: 100%;
        max-width: 900px;
        margin: 30px auto;
    }

    .movie-card {
        color: white;
        text-decoration: none;
        text-align: center;
        cursor: pointer;
        transition: transform 0.2s;
    }

    .movie-card:hover {
        transform: translateY(-5px);
    }

    .movie-card img {
        display: block;
        width: 100%;
        aspect-ratio: 2 / 3;
        object-fit: cover;
        border-radius: 10px;
        background: #281E30;
    }

    .movie-card p {
        margin-top: 10px;
        font-size: 15px;
    }

    /* movie player overlay */
    .movie-overlay {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: rgba(0, 0, 0, 0.8);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2vw;
    }

    .movie-overlay[hidden] {
        display: none;
    }

    .movie-window {
        width: 100%;
        height: 100%;
        background: #1E1824;
        border: 1px solid #49364F;
        border-radius: 8px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        box-shadow: 0 10px 50px rgba(0, 0, 0, 0.5);
    }

    .movie-header {
        height: 48px;
        min-height: 48px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 16px;
        background: #281E30;
        color: white;
        border-bottom: 1px solid #49364F;
        font-size: 14px;
    }

    .movie-header button {
        border: none;
        background: transparent;
        color: white;
        font-size: 26px;
        cursor: pointer;
        padding: 0 4px;
        line-height: 1;
    }

    .movie-header button:hover {
        color: #b98bd0;
    }

    .movie-screen {
        flex: 1;
        min-height: 0;
        background: #000;
    }

    .movie-screen iframe {
        width: 100%;
        height: 100%;
        border: none;
        display: block;
    }

    @media (max-width: 600px) {
        .movie-overlay {
            padding: 8px;
        }

        .movie-window {
            border-radius: 6px;
        }
    }
</style>

<script>
async function loadMovies() {
    const grid = document.getElementById("movie-grid");
    const status = document.getElementById("movie-status");

    status.hidden = false;
    status.textContent = "loading movies...";

    try {
        const response = await fetch("movies.txt");

        if (!response.ok) {
            throw new Error("Could not load movies.txt");
        }

        const text = await response.text();

        const getURL = value => {
            const match = value.match(/\((https?:\/\/[^)]+)\)/);
            return match ? match[1] : value.trim();
        };

        const movies = text.trim().split(/\n\s*\n/).map(block => {
            const movie = {};

            block.split(/\r?\n/).forEach(line => {
                const separator = line.indexOf(" ");
                if (separator === -1) return;

                const key = line.slice(0, separator).trim();
                const value = line.slice(separator + 1).trim();

                movie[key] = key === "NAME" ? value : getURL(value);
            });

            return movie;
        }).filter(movie => movie.NAME && movie.COVER && movie.MOVIE);

        grid.replaceChildren();

        movies.forEach(movie => {
            const card = document.createElement("a");
            card.className = "movie-card";
            card.href = "#";

            const image = document.createElement("img");
            image.src = movie.COVER;
            image.alt = movie.NAME;
            image.loading = "lazy";

            const title = document.createElement("p");
            title.textContent = movie.NAME;

            card.append(image, title);

            card.addEventListener("click", event => {
                event.preventDefault();

                const identifier = new URL(movie.MOVIE).pathname
                    .split("/")
                    .filter(Boolean)
                    .pop();

                document.getElementById("player-title").textContent = movie.NAME;
                document.getElementById("player-frame").src =
                    `https://archive.org/embed/${encodeURIComponent(identifier)}`;

                document.getElementById("movie-overlay").hidden = false;
                document.body.style.overflow = "hidden";
            });

            grid.appendChild(card);
        });

        status.hidden = true;

        if (movies.length === 0) {
            status.hidden = false;
            status.textContent = "nothing to show :(";
        }

    } catch (error) {
        status.hidden = false;
        status.textContent = "couldn't load movies :(";
        console.error(error);
    }
}

function closeMoviePlayer() {
    document.getElementById("movie-overlay").hidden = true;
    document.getElementById("player-frame").src = "";
    document.body.style.overflow = "";
}

document.getElementById("close-player").addEventListener("click", closeMoviePlayer);

document.getElementById("movie-overlay").addEventListener("click", event => {
    if (event.target.id === "movie-overlay") {
        closeMoviePlayer();
    }
});

document.addEventListener("keydown", event => {
    if (event.key === "Escape") {
        closeMoviePlayer();
    }
});

loadMovies();
</script>

</body>
</html>
