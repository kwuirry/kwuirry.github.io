<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>movies</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background: #1E1824;
            color: #fff;
            font-family: "Comic Sans MS", "Comic Sans", "Chalkboard SE", "Comic Neue", sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
            overflow: hidden;
            position: relative;
            isolation: isolate;
        }

        .top-nav {
            position: fixed;
            top: 20px;
            left: 0;
            right: 0;
            z-index: 2;
            display: flex;
            justify-content: center;
            gap: 24px;
        }

        .top-nav a {
            color: #fff;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.2s;
        }

        .top-nav a:hover,
        .top-nav a.active {
            color: #b98bd0;
        }

        .empty-message {
            position: relative;
            z-index: 1;
            font-size: 16px;
            color: #fff;
            text-align: center;
        }
    </style>
</head>
<body>
<nav class="top-nav">
    <a href="index.html">home</a>
    <a href="movies.html" class="active">movies</a>
    <a href="games.html">games</a>
</nav>

<main class="page-content">
    <div id="movie-grid" class="movie-grid"></div>
    <p id="movie-status">loading movies...</p>
</main>

<style>
    .movie-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 24px;
        width: 100%;
        max-width: 900px;
        margin: 30px auto;
    }

    .movie-card {
        color: white;
        text-decoration: none;
        text-align: center;
        transition: transform 0.2s;
    }

    .movie-card:hover {
        transform: translateY(-5px);
    }

    .movie-card img {
        display: block;
        width: 100%;
        aspect-ratio: 2 / 3;
        object-fit: cover;
        border-radius: 10px;
        background: #281E30;
    }

    .movie-card p {
        margin-top: 10px;
        font-size: 15px;
    }
</style>

<script>
async function loadMovies() {
    const grid = document.getElementById("movie-grid");
    const status = document.getElementById("movie-status");

    try {
        const response = await fetch("movies.txt");

        if (!response.ok) {
            throw new Error("Could not load movies.txt");
        }

        const text = await response.text();

        const getURL = value => {
            const match = value.match(/\((https?:\/\/[^)]+)\)/);
            return match ? match[1] : value.trim();
        };

        const movies = text.trim().split(/\n\s*\n/).map(block => {
            const movie = {};

            block.split(/\r?\n/).forEach(line => {
                const separator = line.indexOf(" ");
                if (separator === -1) return;

                const key = line.slice(0, separator).trim();
                const value = line.slice(separator + 1).trim();

                movie[key] = key === "NAME" ? value : getURL(value);
            });

            return movie;
        }).filter(movie => movie.NAME && movie.COVER && movie.MOVIE);

        grid.replaceChildren();

        movies.forEach(movie => {
            const card = document.createElement("a");
            card.className = "movie-card";
            card.href = movie.MOVIE;
            card.target = "_blank";
            card.rel = "noopener noreferrer";

            const image = document.createElement("img");
            image.src = movie.COVER;
            image.alt = movie.NAME;
            image.loading = "lazy";

            const title = document.createElement("p");
            title.textContent = movie.NAME;

            card.append(image, title);
            grid.appendChild(card);
        });

        status.textContent = movies.length
            ? ""
            : "nothing to show :(";

    } catch (error) {
        status.textContent = "couldn't load movies :(";
        console.error(error);
    }
}

loadMovies();
</script>

</body>
</html>
