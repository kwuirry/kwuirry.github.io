<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>movies</title>

<style>
* {
    box-sizing: border-box;
}

body {
    background: #1E1824;
    color: #fff;
    font-family: "Comic Sans MS", "Comic Sans", "Chalkboard SE", "Comic Neue", sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    flex-direction: column;
    margin: 0;
    padding: 80px 20px 30px;
    overflow-x: hidden;
    position: relative;
    isolation: isolate;
}

.top-nav {
    position: fixed;
    top: 20px;
    left: 0;
    right: 0;
    z-index: 2;
    display: flex;
    justify-content: center;
    gap: 24px;
}

.top-nav a {
    color: #fff;
    text-decoration: none;
    font-size: 14px;
    transition: color 0.2s;
}

.top-nav a:hover,
.top-nav a.active {
    color: #b98bd0;
}

/* CRT effect */

.crt-overlay {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
    opacity: 0.28;
    background:
        repeating-linear-gradient(
            to bottom,
            transparent 0px,
            transparent 3px,
            rgba(190, 145, 210, 0.16) 4px,
            transparent 5px
        );
    background-size: 100% 8px;
    animation: scanlines 0.18s linear infinite;
}

.crt-overlay::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    top: -35%;
    height: 30%;
    background: linear-gradient(
        to bottom,
        transparent,
        rgba(190, 125, 220, 0.055),
        transparent
    );
    animation: scan-band 8s linear infinite;
}

@keyframes scanlines {
    from { background-position: 0 0; }
    to { background-position: 0 8px; }
}

@keyframes scan-band {
    from { transform: translateY(0); }
    to { transform: translateY(450vh); }
}

.page-content {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 1000px;
    margin: 0 auto;
}

/* Search */

.movie-search {
    width: 100%;
    max-width: 500px;
    margin: 0 auto 30px;
}

.movie-search input {
    width: 100%;
    padding: 12px 16px;
    background: #281E30;
    color: white;
    border: 1px solid #49364F;
    border-radius: 8px;
    outline: none;
    font-family: inherit;
    font-size: 15px;
}

.movie-search input::placeholder {
    color: #a99bad;
}

.movie-search input:focus {
    border-color: #b98bd0;
}

/* Movie grid */

.movie-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, 160px);
    justify-content: center;
    gap: 24px;
    width: 100%;
    max-width: 900px;
    margin: 0 auto;
}

.movie-card {
    color: white;
    text-decoration: none;
    text-align: center;
    cursor: pointer;
    transition: transform 0.2s;
}

.movie-card:hover {
    transform: translateY(-5px);
}

.movie-card img {
    display: block;
    width: 100%;
    aspect-ratio: 2 / 3;
    object-fit: cover;
    border-radius: 10px;
    background: #281E30;
}

.movie-card p {
    margin-top: 10px;
    font-size: 15px;
}

#movie-status {
    text-align: center;
    font-size: 16px;
    color: #fff;
    margin-top: 25px;
}

/* Player overlay */

.movie-overlay {
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: rgba(0, 0, 0, 0.8);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2vw;
}

.movie-overlay[hidden] {
    display: none;
}

.movie-window {
    width: 100%;
    height: 100%;
    background: #1E1824;
    border: 1px solid #49364F;
    border-radius: 8px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 10px 50px rgba(0, 0, 0, 0.5);
}

.movie-header {
    height: 48px;
    min-height: 48px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    background: #281E30;
    color: white;
    border-bottom: 1px solid #49364F;
    font-size: 14px;
}

.movie-header button {
    border: none;
    background: transparent;
    color: white;
    font-size: 26px;
    cursor: pointer;
    padding: 0 4px;
    line-height: 1;
}

.movie-header button:hover {
    color: #b98bd0;
}

.movie-screen {
    flex: 1;
    min-height: 0;
    background: #000;
    position: relative;
}

.movie-screen iframe,
.movie-screen video {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
    background: #000;
}

.movie-screen video {
    object-fit: contain;
}

@media (max-width: 600px) {
    .movie-overlay {
        padding: 8px;
    }

    .movie-window {
        border-radius: 6px;
    }

    .movie-grid {
        grid-template-columns: repeat(auto-fit, minmax(130px, 160px));
        gap: 16px;
    }
}

@media (prefers-reduced-motion: reduce) {
    .crt-overlay,
    .crt-overlay::after {
        animation: none;
    }
}
</style>
</head>

<body>

<nav class="top-nav">
    <a href="index.html">home</a>
    <a href="movies.html" class="active">movies</a>
    <a href="games.html">games</a>
</nav>

<audio id="background-music" src="music.mp3" autoplay loop></audio>

<div class="crt-overlay" aria-hidden="true"></div>

<main class="page-content">

    <div class="movie-search">
        <input
            type="search"
            id="movie-search"
            placeholder="search movies..."
            autocomplete="off"
        >
    </div>

    <div id="movie-grid" class="movie-grid"></div>
    <p id="movie-status">loading movies...</p>

</main>

<div id="movie-overlay" class="movie-overlay" hidden>
    <div class="movie-window">

        <div class="movie-header">
            <span id="player-title"></span>
            <button id="close-player" aria-label="Close player">&times;</button>
        </div>

        <div class="movie-screen">

            <iframe
                id="player-frame"
                allowfullscreen
                webkitallowfullscreen
                mozallowfullscreen
                allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
            ></iframe>

            <video
                id="player-video"
                controls
                playsinline
                preload="metadata"
                hidden
            ></video>

        </div>

    </div>
</div>

<script>
async function loadMovies() {
    const grid = document.getElementById("movie-grid");
    const status = document.getElementById("movie-status");
    const search = document.getElementById("movie-search");

    try {
        const response = await fetch("movies.txt", {
            cache: "no-store"
        });

        if (!response.ok) {
            throw new Error("Could not load movies.txt");
        }

        const text = await response.text();

        function getURL(value) {
            const match = value.match(/\((https?:\/\/[^)]+)\)/);
            return match ? match[1] : value.trim();
        }

        // Every NAME starts a new movie.
        const movies = [];
        let movie = {};

        for (const rawLine of text.split(/\r?\n/)) {
            const line = rawLine.trim();

            if (!line) continue;

            const separator = line.indexOf(" ");
            if (separator === -1) continue;

            const key = line.slice(0, separator).trim();
            const value = line.slice(separator + 1).trim();

            if (key === "NAME" && movie.NAME) {
                if (movie.COVER && movie.MOVIE) {
                    movies.push(movie);
                }

                movie = {};
            }

            movie[key] = key === "NAME" ? value : getURL(value);
        }

        if (movie.NAME && movie.COVER && movie.MOVIE) {
            movies.push(movie);
        }

        grid.replaceChildren();

        const cards = [];

        movies.forEach(movie => {
            const card = document.createElement("a");
            card.className = "movie-card";
            card.href = "#";

            const image = document.createElement("img");
            image.src = movie.COVER;
            image.alt = movie.NAME;
            image.loading = "lazy";

            const title = document.createElement("p");
            title.textContent = movie.NAME;

            card.append(image, title);

            card.addEventListener("click", event => {
                event.preventDefault();
                openMovie(movie);
            });

            grid.appendChild(card);
            cards.push({ card, movie });
        });

        function filterMovies() {
            const query = search.value.toLowerCase().trim();
            let visible = 0;

            cards.forEach(({ card, movie }) => {
                const matches = movie.NAME.toLowerCase().includes(query);
                card.hidden = !matches;

                if (matches) visible++;
            });

            if (movies.length === 0) {
                status.textContent = "nothing to show :(";
                status.hidden = false;
            } else if (visible === 0) {
                status.textContent = "no movies found :(";
                status.hidden = false;
            } else {
                status.hidden = true;
            }
        }

        search.addEventListener("input", filterMovies);
        filterMovies();

    } catch (error) {
        status.hidden = false;
        status.textContent = "couldn't load movies :(";
        console.error(error);
    }
}

function openMovie(movie) {
    const overlay = document.getElementById("movie-overlay");
    const frame = document.getElementById("player-frame");
    const video = document.getElementById("player-video");
    const music = document.getElementById("background-music");

    let movieURL;

    try {
        movieURL = new URL(movie.MOVIE);
    } catch (error) {
        console.error("Invalid movie URL:", error);
        return;
    }

    const hostname = movieURL.hostname.toLowerCase();

    document.getElementById("player-title").textContent = movie.NAME;

    // Stop previous playback.
    frame.src = "";
    video.pause();
    video.removeAttribute("src");
    video.load();

    // Pause background music.
    music.pause();

    const isArchive =
        hostname === "archive.org" ||
        hostname.endsWith(".archive.org");

    const isPlayDrive =
        hostname === "playdrive.vip" ||
        hostname.endsWith(".playdrive.vip");

    if (isArchive) {
        const parts = movieURL.pathname.split("/").filter(Boolean);

        if (parts[0] === "details" && parts[1]) {
            frame.src = "https://archive.org/embed/" +
                encodeURIComponent(parts[1]);
        } else {
            frame.src = movieURL.href;
        }

        frame.hidden = false;
        video.hidden = true;

    } else if (isPlayDrive) {
        // PlayDrive pages use their own embedded player.
        frame.src = movieURL.href;
        frame.hidden = false;
        video.hidden = true;

    } else {
        // Direct video files use the native video player.
        frame.hidden = true;
        video.hidden = false;
        video.src = movie.MOVIE;

        video.play().catch(error => {
            console.log("Playback needs user interaction:", error);
        });
    }

    overlay.hidden = false;
    document.body.style.overflow = "hidden";
}

function closeMoviePlayer() {
    const overlay = document.getElementById("movie-overlay");
    const frame = document.getElementById("player-frame");
    const video = document.getElementById("player-video");

    overlay.hidden = true;

    video.pause();
    video.removeAttribute("src");
    video.load();

    frame.src = "";

    document.body.style.overflow = "";
}

document.getElementById("close-player").addEventListener(
    "click",
    closeMoviePlayer
);

document.getElementById("movie-overlay").addEventListener("click", event => {
    if (event.target.id === "movie-overlay") {
        closeMoviePlayer();
    }
});

document.addEventListener("keydown", event => {
    if (event.key === "Escape") {
        closeMoviePlayer();
    }
});

loadMovies();
</script>

</body>
</html>
